name: Compile and runtime contracts

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache pkg-config libfreetype-dev libcurl4-openssl-dev zlib1g-dev ffmpeg imagemagick python3-yaml
      - name: Stage original source and audit script calls
        run: |
          mkdir -p build
          bash tools/stage_sources.sh
          python3 tools/audit_script_call_defaults.py --strict
          python3 -m unittest tools.test_script_call_defaults
      - name: Python contracts
        if: matrix.sanitizer == 'asan-ubsan'
        run: python3 tools/run_python_contracts.py
      - name: Sanitized retail-free host probes
        env:
          RV_SANITIZER: ${{ matrix.sanitizer }}
        run: |
          if [ "$RV_SANITIZER" = tsan ]; then
            python3 tools/run_host_probes.py --build-dir build/ci-host-tsan --sanitizer tsan --disable-aslr --jobs 2
          else
            python3 tools/run_host_probes.py --build-dir build/ci-host-asan --sanitizer asan-ubsan --jobs 2
          fi
      - name: Compile changed original texture worker
        if: matrix.sanitizer == 'asan-ubsan'
        run: python3 tools/check_excluded_original_sources.py --build-dir build/ci-host-asan --target a31_interactive_runtime --report build/ci-excluded-host.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.sanitizer }}-evidence
          path: |
            build/ci-host-*/host-probe-summary.json
            build/ci-host-*/probe-logs/*.log
            build/python-contract-summary.json
            build/ci-excluded-host*
          if-no-files-found: warn

  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: vitasdk/vitasdk:2026.08-20260813@sha256:1d949171694d63336abf6d4b591c2a87a5be54f62627bdbc244d7529e9de65d8
    steps:
      - name: Install host build helpers
        run: |
          apt-get update
          apt-get install -y ccache unzip imagemagick libfreetype-dev libcurl4-openssl-dev zlib1g-dev ffmpeg
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compile and link native ARM candidate
        env:
          RENEGADE_FAST_SCOPE: compile
          RENEGADE_FAST_TESTS: focused
          RENEGADE_CANDIDATE_LABEL: A3.5-dev209
          RENEGADE_BUILD_JOBS: '2'
          RENEGADE_VITASDK: /usr/local/vitasdk
          RENEGADE_BUILDER_ROOT: /tmp/renegade-ci-evidence
        run: |
          mkdir -p /tmp/renegade-ci-evidence
          bash tools/build_fast_candidate.sh
      - name: Compile changed original texture worker
        run: python3 tools/check_excluded_original_sources.py --build-dir build/vita-fast-candidate --target RenegadeVitaA31 --report build/ci-excluded-arm.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-link-evidence
          path: |
            /tmp/renegade-ci-evidence/logs/*build.log
            /tmp/renegade-ci-evidence/dist/*FAST-COMPILE*
            /tmp/renegade-ci-evidence/dist/*.map
            /tmp/renegade-ci-evidence/dist/*.elf
            /tmp/renegade-ci-evidence/dist/*.elf-header.txt
            /tmp/renegade-ci-evidence/dist/*.symbols.txt
            build/ci-excluded-arm*
          if-no-files-found: warn
